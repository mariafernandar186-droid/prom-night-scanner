
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner PROM NIGHT III BTPE 2026</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      background: #101010;
      color: #f8f3e8;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .panel {
      background: #1c1c1c;
      border: 1px solid #b99a53;
      border-radius: 16px;
      padding: 22px;
      margin-top: 15px;
    }

    h1 {
      color: #d8bd79;
      letter-spacing: 2px;
      font-size: 25px;
    }

    h2 { color: #d8bd79; }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    .message {
      color: #d8bd79;
      min-height: 25px;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #c7a75e;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    .status {
      font-size: 25px;
      font-weight: bold;
      color: #d8bd79;
      margin: 20px 0;
    }

    .person {
      padding: 14px;
      border-bottom: 1px solid #5b4b2b;
      margin-top: 8px;
    }

    .person strong {
      display: block;
      color: #d8bd79;
      margin-bottom: 8px;
    }

    .code {
      color: #c9c1b0;
      margin-top: 20px;
    }

    .time {
      color: #c9c1b0;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="panel" id="scannerPanel">
      <h1>PROM NIGHT</h1>
      <p>III BTPE 2026</p>
      <h2>CONTROL DE ENTRADAS</h2>

      <p>Coloca el código QR frente a la cámara.</p>

      <div id="reader"></div>

      <div id="cameraMessage" class="message">
        Preparando cámara...
      </div>
    </div>

    <div class="panel hidden" id="resultPanel">
      <h1>PROM NIGHT</h1>
      <p>III BTPE 2026</p>

      <div class="status" id="resultStatus"></div>
      <p id="resultMessage"></p>

      <div id="resultNames"></div>

      <p class="code" id="resultCode"></p>
      <p class="time" id="resultTime"></p>

      <button onclick="nextScan()">ESCANEAR SIGUIENTE</button>
    </div>

  </div>

<script>
  const params = new URLSearchParams(location.search);
  const parentOrigin = params.get('parentOrigin');

  let scanner = null;
  let busy = false;
  let currentRequestId = null;
  let responseTimer = null;

  function setCameraMessage(message) {
    document.getElementById('cameraMessage').textContent = message;
  }

  async function startCamera() {
    busy = false;

    document.getElementById('scannerPanel')
      .classList.remove('hidden');

    document.getElementById('resultPanel')
      .classList.add('hidden');

    setCameraMessage('Solicitando acceso a la cámara...');

    if (!parentOrigin) {
      setCameraMessage(
        'Falta la conexión con la página principal. Abre el escáner desde el panel de control.'
      );
      return;
    }

    if (!window.opener || window.opener.closed) {
      setCameraMessage(
        'No se encontró la página principal. Mantén abierta la página de control y vuelve a abrir el escáner.'
      );
      return;
    }

    if (!window.isSecureContext) {
      setCameraMessage(
        'La cámara requiere una conexión HTTPS segura.'
      );
      return;
    }

    try {
      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        handleScan,
        () => {}
      );

      setCameraMessage('Cámara activa. Escanea un código QR.');

    } catch (error) {
      setCameraMessage(
        'No se pudo activar la cámara. Revisa los permisos de Safari o Chrome y permite el acceso a la cámara.'
      );
    }
  }

  async function stopCamera() {
    if (!scanner) return;

    try {
      if (scanner.isScanning) {
        await scanner.stop();
      }
    } catch (error) {
      // Continúa al mostrar el resultado.
    }
  }

  async function handleScan(decodedText) {
    if (busy) return;

    busy = true;

    const code = String(decodedText || '')
      .trim()
      .toUpperCase();

    if (!code) {
      busy = false;
      return;
    }

    setCameraMessage('Código detectado. Verificando entrada...');

    await stopCamera();

    currentRequestId =
      Date.now().toString() + '-' +
      Math.random().toString(36).slice(2);

    if (!window.opener || window.opener.closed) {
      showResult({
        ok: false,
        status: 'SIN CONEXIÓN',
        message: 'La página principal se cerró. Vuelve a abrir el control de entradas.',
        code: code,
        names: []
      });
      return;
    }

    window.opener.postMessage({
      type: 'PROM_NIGHT_QR',
      requestId: currentRequestId,
      code: code
    }, parentOrigin);

    responseTimer = setTimeout(() => {
      if (busy) {
        showResult({
          ok: false,
          status: 'SIN RESPUESTA',
          message: 'No se recibió respuesta. Comprueba que la página principal siga abierta y que la sesión esté activa.',
          code: code,
          names: []
        });
      }
    }, 20000);
  }

  window.addEventListener('message', event => {
    if (event.origin !== parentOrigin) return;
    if (!window.opener || event.source !== window.opener) return;
    if (!event.data || event.data.type !== 'PROM_NIGHT_RESULT') return;
    if (event.data.requestId !== currentRequestId) return;

    clearTimeout(responseTimer);
    showResult(event.data.result);
  });

  function showResult(data) {
    busy = false;

    document.getElementById('scannerPanel')
      .classList.add('hidden');

    document.getElementById('resultPanel')
      .classList.remove('hidden');

    document.getElementById('resultStatus').textContent =
      data.status || 'RESULTADO';

    document.getElementById('resultMessage').textContent =
      data.message || '';

    document.getElementById('resultCode').textContent =
      data.code ? 'Código: ' + data.code : '';

    const namesContainer =
      document.getElementById('resultNames');

    namesContainer.innerHTML = '';

    (data.names || []).forEach(person => {
      const div = document.createElement('div');
      div.className = 'person';

      const label = document.createElement('strong');
      label.textContent = person.label || '';

      const name = document.createElement('span');
      name.textContent = person.name || '';

      div.appendChild(label);
      div.appendChild(name);
      namesContainer.appendChild(div);
    });

    let timeText = '';

    if (data.timestamp) {
      const date = new Date(data.timestamp);

      if (!isNaN(date.getTime())) {
        timeText = date.toLocaleString();
      }
    }

    document.getElementById('resultTime').textContent =
      timeText ? 'Fecha y hora: ' + timeText : '';
  }

  async function nextScan() {
    clearTimeout(responseTimer);
    currentRequestId = null;

    document.getElementById('resultPanel')
      .classList.add('hidden');

    document.getElementById('scannerPanel')
      .classList.remove('hidden');

    document.getElementById('reader').innerHTML = '';

    scanner = null;
    busy = false;

    await startCamera();
  }

  window.addEventListener('load', startCamera);
</script>
</body>
</html>
